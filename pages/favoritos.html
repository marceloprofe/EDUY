<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis favoritos | EDUY</title>

    <link rel="icon" type="image/png" href="../img/logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/estilo.css" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="../index.html"
        >
          <img src="../img/logo.png" class="logo-navbar" alt="Logo de EDUY" />
          <span class="h4 mb-0">EDUY</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuPrincipal"
          aria-controls="menuPrincipal"
          aria-expanded="false"
          aria-label="Mostrar navegación"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto" data-menu-sesion hidden>
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./cursos.html">Cursos</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link active"
                href="./favoritos.html"
                aria-current="page"
              >
                Favoritos
                <span id="contadorFavoritos" class="badge text-bg-warning">
                  0
                </span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./login.html" data-auth-login>
                Ingresar
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./registro.html" data-auth-registro>
                Registro
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container flex-grow-1 py-5">
      <div class="row justify-content-center">
        <section class="col-xl-9" aria-labelledby="tituloFavoritos">
          <h1 id="tituloFavoritos" class="fw-bold mb-2">Mis favoritos</h1>
          <p class="text-body-secondary">
            Guardá los cursos que te interesan y adquirilos cuando quieras.
          </p>

          <div
            id="mensajeFavoritos"
            class="alert d-none"
            role="status"
            aria-live="polite"
          ></div>

          <div
            id="estadoFavoritos"
            class="text-body-secondary"
            aria-live="polite"
          >
            Cargando cursos…
          </div>

          <div id="listaFavoritos" class="d-grid gap-3"></div>

          <a href="./cursos.html" class="btn btn-outline-secondary mt-4">
            Seguir explorando cursos
          </a>
        </section>
      </div>
    </main>

    <div data-footer-eduy data-raiz=".."></div>

    <script src="../js/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/sesion.js"></script>
    <script type="module" src="../js/favoritos.js"></script>
  </body>
</html>
