<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mis cursos | EDUY</title>

    <link rel="icon" type="image/png" href="../img/logo.png" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/estilo.css" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="../index.html"
        >
          <img src="../img/logo.png" class="logo-navbar" alt="Logo de EDUY" />

          <span class="h4 mb-0">EDUY</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuPrincipal"
          aria-controls="menuPrincipal"
          aria-expanded="false"
          aria-label="Mostrar navegación"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html"> Inicio </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="./cursos.html"> Cursos </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="./login.html"> Ingresar </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="./registro.html"> Registro </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container flex-grow-1 py-5">
      <div
        class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"
      >
        <div>
          <h1 class="fw-bold mb-1">Mis cursos</h1>

          <p class="text-body-secondary mb-0">
            Gestioná los cursos creados por vos.
          </p>
        </div>

        <button
          type="button"
          class="btn btn-oro"
          data-bs-toggle="collapse"
          data-bs-target="#formularioCurso"
          aria-expanded="false"
          aria-controls="formularioCurso"
        >
          Crear curso
        </button>
      </div>

      <div id="mensajeCurso" class="d-none" role="alert"></div>

      <section class="collapse mb-5" id="formularioCurso">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="h4 fw-bold mb-4">Nuevo curso</h2>

            <form id="formCurso">
              <div class="mb-3">
                <label for="titulo" class="form-label"> Título </label>

                <input
                  type="text"
                  class="form-control"
                  id="titulo"
                  name="titulo"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="descripcion" class="form-label">
                  Descripción
                </label>

                <textarea
                  class="form-control"
                  id="descripcion"
                  name="descripcion"
                  rows="4"
                  required
                ></textarea>
              </div>

              <div class="mb-3">
                <label for="nivel" class="form-label"> Nivel </label>

                <select class="form-select" id="nivel" name="nivel" required>
                  <option value="">Seleccionar nivel</option>

                  <option value="basico">Básico</option>

                  <option value="intermedio">Intermedio</option>

                  <option value="avanzado">Avanzado</option>
                </select>
              </div>

              <button type="submit" class="btn btn-oro">
                Guardar como borrador
              </button>
            </form>
          </div>
        </div>
      </section>

      <section aria-labelledby="tituloListaCursos">
        <h2 id="tituloListaCursos" class="h4 fw-bold mb-3">Cursos creados</h2>

        <div id="listaCursos" class="row g-4">
          <p class="text-body-secondary">Cargando cursos...</p>
        </div>
      </section>
    </main>

    <div data-footer-eduy data-raiz=".."></div>

    <script src="../js/footer.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="../js/sesion.js"></script>

    <script type="module" src="../js/mis-cursos.js"></script>
  </body>
</html>
