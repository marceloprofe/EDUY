<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | EDUY</title>
    <link rel="icon" type="image/png" href="../img/logo.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/estilo.css" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
          <img src="../img/logo.png" class="logo-navbar" alt="Logo de EDUY" />
          <span class="h4 mb-0">Bienvenido a EDUY</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar navegación">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="./cursos.html">Cursos</a></li>
            <li class="nav-item"><a class="nav-link active" href="./login.html">Ingresar</a></li>
            <li class="nav-item"><a class="nav-link" href="#registro">Registrarse</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container d-flex align-items-center justify-content-center flex-grow-1 py-5">
      <section class="card login-card shadow-lg" aria-labelledby="tituloLogin">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <img src="../img/logo.png" class="login-logo mb-3" alt="EDUY" />
            <h1 id="tituloLogin" class="h2 fw-bold">Iniciar sesión</h1>
            <p class="text-body-secondary mb-0">Ingresá a tu cuenta para continuar aprendiendo.</p>
          </div>

          <form action="#" method="post">
            <div class="mb-3">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control form-control-lg" id="correo" name="correo" autocomplete="email" placeholder="nombre@ejemplo.com" required />
            </div>

            <div class="mb-3">
              <label for="contrasena" class="form-label">Contraseña</label>
              <input type="password" class="form-control form-control-lg" id="contrasena" name="contrasena" autocomplete="current-password" minlength="8" placeholder="Ingresá tu contraseña" required />
            </div>

            <div class="d-flex flex-wrap justify-content-between gap-2 mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="recordarme" name="recordarme" />
                <label class="form-check-label" for="recordarme">Recordarme</label>
              </div>
              <a href="#recuperar" class="login-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn btn-oro btn-lg w-100">Ingresar</button>
          </form>

          <p id="registro" class="text-center mt-4 mb-0">
            ¿Todavía no tenés una cuenta?
            <a href="#registro" class="login-link fw-bold">Registrate</a>
          </p>
        </div>
      </section>
    </main>

    <div data-footer-eduy data-raiz=".."></div>

    <script src="../js/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
