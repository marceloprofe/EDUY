<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/estilo.css" />

    <title>Cursos | EDUY</title>
    <link rel="icon" type="image/png" href="../img/logo.png" />
  </head>

  <body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="../index.html"
        >
          <img src="../img/logo.png" class="logo-navbar" alt="Logo de EDUY" />
          <h1 class="h4 mb-0">Bienvenido a EDUY</h1>
        </a>

        <!-- Botón del menú para celulares -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuPrincipal"
          aria-controls="menuPrincipal"
          aria-expanded="false"
          aria-label="Mostrar navegación"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="./cursos.html">Cursos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./login.html" data-auth-login>
                Ingresar
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./registro.html" data-auth-registro>
                Registro
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container py-5">
      <div class="text-center mb-5">
        <h1 class="fw-bold">Nuestros cursos</h1>
        <p class="lead">
          Encontrá el curso que mejor se adapte a tus objetivos.
        </p>
      </div>

      <!-- Buscador y filtros de cursos -->
      <section class="filtros-cursos p-4 mb-4" aria-labelledby="tituloFiltros">
        <h2 id="tituloFiltros" class="h5 mb-3">Buscar cursos</h2>

        <div class="row g-3 align-items-end">
          <div class="col-md-7">
            <label for="buscarCurso" class="form-label"> Nombre o tema </label>
            <input
              type="search"
              id="buscarCurso"
              class="form-control"
              placeholder="Ejemplo: Arduino, Python o robótica"
            />
          </div>

          <div class="col-md-3">
            <label for="filtroNivel" class="form-label"> Nivel </label>
            <select id="filtroNivel" class="form-select">
              <option value="">Todos los niveles</option>
              <option value="basico">Básico</option>
              <option value="intermedio">Intermedio</option>
              <option value="avanzado">Avanzado</option>
            </select>
          </div>

          <div class="col-md-2 d-grid">
            <button type="button" id="limpiarFiltros" class="btn btn-oro">
              Limpiar
            </button>
          </div>
        </div>

        <p id="resultadoFiltros" class="small mt-3 mb-0" aria-live="polite">
          Mostrando todos los cursos.
        </p>
      </section>

      <div id="listaCursos" class="row g-4" aria-live="polite"></div>
    </main>

    <div data-footer-eduy data-raiz=".."></div>

    <script src="../js/filtros.js"></script>
    <script src="../js/footer.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="../js/cursos-firestore.js"></script>

    <script type="module" src="../js/sesion.js"></script>
  </body>
</html>
