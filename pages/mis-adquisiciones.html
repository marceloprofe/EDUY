<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis cursos adquiridos | EDUY</title>

  <link rel="icon" type="image/png" href="../img/logo.png">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/estilo.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2"
         href="../index.html">
        <img src="../img/logo.png"
             class="logo-navbar"
             alt="Logo de EDUY">
        <span class="h4 mb-0">EDUY</span>
      </a>

      <button class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#menuPrincipal"
              aria-controls="menuPrincipal"
              aria-expanded="false"
              aria-label="Mostrar navegación">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="./cursos.html">Cursos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="./login.html">Ingresar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="./registro.html">Registro</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container flex-grow-1 py-5">
    <h1 class="h2 fw-bold mb-4">Mis cursos adquiridos</h1>

    <!-- La integración controlará los mensajes de carga y error. -->
    <div id="estadoAdquisiciones"
         class="alert alert-info d-none"
         role="status"
         aria-live="polite"
         aria-atomic="true">
      Cargando adquisiciones…
    </div>

    <!-- Se mostrará cuando la consulta confirme que el historial está vacío. -->
    <div id="mensajeSinAdquisiciones"
         class="alert alert-info d-none"
         role="status">
      Todavía no tenés adquisiciones.
      <a href="./cursos.html" class="alert-link">
        Explorá el catálogo de cursos.
      </a>
    </div>

    <section aria-labelledby="tituloHistorial">
      <h2 id="tituloHistorial" class="h4 mb-4">
        Historial de adquisiciones
      </h2>
      <div id="listaAdquisiciones" class="row g-4" aria-live="polite">
        <!-- Las tarjetas del historial se cargan desde Firestore. -->
      </div>
    </section>

    <a href="./cursos.html" class="btn btn-oro mt-4">
      Explorar cursos
    </a>
  </main>

  <div data-footer-eduy data-raiz=".."></div>

  <script src="../js/footer.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>
  <script type="module" src="../js/mis-adquisiciones.js"></script>
<script type="module" src="../js/sesion.js"></script>
</body>
</html>
