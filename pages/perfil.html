<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi perfil | EDUY</title>

  <link rel="icon" type="image/png" href="../img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilo.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
        <img src="../img/logo.png" class="logo-navbar" alt="Logo de EDUY">
        <span class="h4 mb-0">EDUY</span>
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menuPrincipal"
        aria-controls="menuPrincipal"
        aria-expanded="false"
        aria-label="Mostrar navegación"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto" data-menu-sesion hidden>
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="./cursos.html">Cursos</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5 flex-grow-1">
    <h1 class="mb-4">Mi perfil</h1>

    <div id="cargandoPerfil" class="alert alert-info" role="status" aria-live="polite">
      Cargando información del usuario...
    </div>

    <section id="contenidoPerfil" class="card shadow-sm d-none" aria-labelledby="tituloDatosCuenta">
      <div class="card-body p-4">
        <h2 id="tituloDatosCuenta" class="h4 mb-4">Datos de la cuenta</h2>

        <p>
          <strong>Nombre:</strong>
          <span id="nombreUsuario"></span>
        </p>

        <p>
          <strong>Correo electrónico:</strong>
          <span id="correoUsuario"></span>
        </p>

        <p class="mb-0">
          <strong>Rol:</strong>
          <span id="rolUsuario" class="badge text-bg-primary"></span>
        </p>
        <a id="enlaceMisAdquisiciones" href="./mis-adquisiciones.html" class="btn btn-oro mt-4 d-none">
          Ver mis adquisiciones
        </a>
      </div>
    </section>
  </main>

  <div data-footer-eduy data-raiz=".."></div>

  <script type="module" src="../js/perfil.js"></script>
  <script type="module" src="../js/sesion.js"></script>
  <script src="../js/footer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="../js/zoom.js"></script>
</body>

</html>
